<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"/><title>Hunting Run · Prototype08 Playtest</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15271f;color:#f5e7ba;font:14px system-ui}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#465440,#14231d 70%)}#frame{position:relative;height:min(100dvh,177.777778vw);width:min(100vw,56.25dvh);box-shadow:0 0 100px #0008;background:#bd9861}canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#263d2f;gap:18px;text-align:center;padding:24px}h1{font-size:42px;line-height:.9;letter-spacing:-2px;color:#edbd58;margin:0}#bar{width:75%;height:4px;background:#66704b}#progress{height:100%;width:0;background:#e8b851}#note{font-size:12px;opacity:.8}#error{white-space:pre-wrap}</style></head>
<body><main id="frame"><canvas id="unity-canvas" tabindex="0" aria-label="Hunting Run. Swipe or use A D, W S; Enter shoots and Escape pauses."></canvas><div id="loading"><p>JUNGLE TRAIL</p><h1>HUNTING<br>RUN</h1><div id="bar"><div id="progress"></div></div><div id="note">Preparing your expedition…</div><div id="error"></div></div></main>
<script>const playtestUrl=new URL(location.href);playtestUrl.searchParams.set('feel','1');history.replaceState(null,'',playtestUrl);
const originalDatabaseOpen=indexedDB.open.bind(indexedDB),originalDatabaseDelete=indexedDB.deleteDatabase.bind(indexedDB);
const playtestDatabaseName=name=>name==='/idbfs'?'HuntingRun.Prototype08:/idbfs':name;
indexedDB.open=(name,...args)=>originalDatabaseOpen(playtestDatabaseName(name),...args);
indexedDB.deleteDatabase=(name,...args)=>originalDatabaseDelete(playtestDatabaseName(name),...args);
const canvas=document.getElementById('unity-canvas');const buildUrl='Build';const config={dataUrl:buildUrl+'/WebGL.data.unityweb',frameworkUrl:buildUrl+'/WebGL.framework.js.unityweb',codeUrl:buildUrl+'/WebGL.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Hunting Run',productName:'Hunting Run',productVersion:'0.1.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2),showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message;}};const script=document.createElement('script');script.src=buildUrl+'/WebGL.loader.js';script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').style.width=(p*100)+'%').then(instance=>{window.huntingRun=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(e=>document.getElementById('error').textContent=String(e));document.body.appendChild(script);canvas.addEventListener('contextmenu',e=>e.preventDefault());</script></body></html>
